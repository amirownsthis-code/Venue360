<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Events | Admin - Venue360</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/manage_events.css') }}">

</head>
<body>

<!-- NAVBAR -->
<nav>
    <div class="logo">Venue<span>360</span></div>
    <div class="nav-links">
        <a href="{{ url_for('admin_dashboard') }}">Home</a>
        <a href="{{ url_for('add_event') }}">Add Event</a>
        <a href="{{ url_for('manage_events') }}" class="active">Manage Events</a>
        <a href="{{ url_for('admin_view_registrations') }}">View Registrations</a>
        <a href="{{ url_for('index') }}">Logout</a>
    </div>
</nav>

<!-- PAGE CONTENT -->
<div class="page-wrapper">

    <h1>Manage Events</h1>
    <p class="subtitle">View, edit or delete events created by admin</p>

    <!-- EVENTS TABLE -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Society</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Venue</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <!-- EVENTS WILL COME FROM BACKEND -->
                <!-- Example Jinja loop -->
                <!--
                {% for event in events %}
                -->
                <tr>
                    <td>{{ event.title }}</td>
                    <td>{{ event.society }}</td>
                    <td>{{ event.date }}</td>
                    <td>{{ event.time }}</td>
                    <td>{{ event.venue }}</td>
                    <td class="actions">
                        <a href="/admin/edit-event/{{ event.id }}" class="edit-btn">Edit</a>
                        <a href="/admin/delete-event/{{ event.id }}" class="delete-btn"
                           onclick="return confirm('Are you sure you want to delete this event?')">
                           Delete
                        </a>
                    </td>
                </tr>
                <!--
                {% endfor %}
                -->
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
