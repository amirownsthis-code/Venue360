<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venue360- Register</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/student_register.css') }}">

</head>
<body>
    <div class="register-container">
        <h2>Register for Venue<span>360</span></h2>
        <form id="register-form">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="username" required>
            <br>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="email" required>
            <br>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="password" required>
            <br>
            
            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm_password" placeholder="confirm password" required>

            <div class="optional-section">
    <h3>Additional Information (Optional)</h3>
    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" placeholder="e.g. 0300-1234567">
    <br>
    <label for="department">Department / Program:</label>
    <select id="department" name="department" >
        <option value="">Select your department</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Software Engineering">Software Engineering</option>
        <option value="Information Technology">Information Technology</option>
        <option value="Electrical Engineering">Electrical Engineering</option>
        <option value="Mechanical Engineering">Mechanical Engineering</option>
        <option value="Data Science">Data Science</option>
        <option value="Psychology">Psychology</option>
        <option value="Other">Other</option>
    </select>
    <br>
    <label for="year">Year / Semester:</label>
    <select id="year" name="year">
        <option value="">Select your year/semester</option>
        <option value="1st Semester">1st Semester</option>
        <option value="2nd Semester">2nd Semester</option>
        <option value="3rd Semester">3rd Semester</option>
        <option value="4th Semester">4th Semester</option>
        <option value="5th Semester">5th Semester</option>
        <option value="6th Semester">6th Semester</option>
        <option value="7th Semester">7th Semester</option>
        <option value="8th Semester">8th Semester</option>
    </select>
    <br>
    <label for="student-id">Student ID:</label>
    <input type="text" id="student-id" name="student_id" placeholder="e.g. 45-CS-123">

    <br>
    <label for="profile-pic">Profile Picture (Optional):</label>
    <input type="file" id="profile-pic" name="profile_pic" accept="image/*">
    <br>
    <button type="submit">Register</button>
</div>
        </form>
        <div class="links">
            <a href="{{ url_for('student_login') }}">Already have an account? Login</a>
        </div>
        <br>
        
    </div>
</body>
</html>
