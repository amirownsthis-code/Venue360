<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Events | Venue360</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='view_events.css') }}">
</head>

<body>

    <!-- NAVBAR -->
    <nav>
        <div class="logo">Venue<span>360</span></div>
        <ul>
        <li><a href="{{ url_for('student_dashboard') }}" >Home</a></li>
        <li><a href="{{ url_for('view_events') }}" class="active">View Events</a></li>
        <li><a href="{{ url_for('my_registrations') }}">Registered Events</a></li>
        <li><a href="{{ url_for('index') }}">Logout</a></li>

        </ul>
    </nav>

    <!-- MAIN PAGE CONTENT -->
    <div class="page-container">

        <!-- SEARCH BAR -->
        <div class="search-wrapper">
            <div class="search-container">
                <input type="text" placeholder="Search events..." class="search-input" id="searchInput">
                <button class="search-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="white" viewBox="0 0 16 16">
                        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85zm-5.242 1.656a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- EVENTS GRID -->
        <div class="events-grid" id="eventsGrid">
            <!-- Event cards will be dynamically inserted here by Flask -->
            {% for event in registered_events %}
            <div class="event-card">
                <div class="event-title">{{ event.title }}</div>
                <div class="event-info">
                    {{ event.society }} • {{ event.date }} • {{ event.time }}
                </div>
                <a href="{{ event.google_form_link }}" target="_blank">
                    <button class="register-btn">Register</button>
                </a>
            </div>
            {% else %}
            <p style="grid-column:1/-1; text-align:center; color:#ccc;">No events found.</p>
            {% endfor %}
        </div>

    </div>

    <!-- SEARCH BAR JS -->
    <script>
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', function() {
            const filter = searchInput.value.toLowerCase();
            const cards = document.querySelectorAll('.event-card');
            cards.forEach(card => {
                const title = card.querySelector('.event-title').textContent.toLowerCase();
                if(title.includes(filter)) {
                    card.style.display = '';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    </script>

</body>
</html>
